<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The primary redirect mechanism (0 seconds delay) -->
    <meta http-equiv="refresh" content="0; url=https://sites.google.com/view/kittycatgames/home">
    <link rel="canonical" href="https://sites.google.com/view/kittycatgames/home">
</head>
<body>
    <!-- 2. Fallback text link in case the browser blocks automatic refreshing -->
    <p>Redirecting you to our actual site... If you are not redirected automatically, <a href="https://sites.google.com/view/kittycatgames/home">click here</a>.</p>
    
    <!-- 3. Optional JavaScript fallback for extra reliability -->
    <script>
        window.location.href = "https://sites.google.com/view/kittycatgames/home";
    </script>
</body>
</html>
